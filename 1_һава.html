<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather in Tatar – Һава торышы</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            background: #7EC8E3;
            user-select: none;
        }

        .app {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #7EC8E3 0%, #B5E3F5 45%, #D6F0FA 70%, #F0F9FF 100%);
            position: relative;
            overflow: hidden;
        }

        .header {
            flex: 0 0 auto;
            padding: 14px 32px 10px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            border-bottom: 5px solid rgba(255, 255, 255, 0.7);
            z-index: 20;
            flex-wrap: wrap;
            gap: 10px 20px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: clamp(32px, 5vh, 64px);
            font-weight: 700;
            color: #1F3A4B;
            text-shadow: 0 2px 16px rgba(255, 255, 255, 0.8);
            letter-spacing: 0.5px;
        }
        .header-title .icon-big {
            font-size: clamp(44px, 6vh, 76px);
        }
        .header-title .sub {
            font-size: clamp(18px, 2.4vh, 34px);
            font-weight: 400;
            color: #2C5A7A;
            margin-left: 8px;
            opacity: 0.9;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 12px 34px;
            border: none;
            border-radius: 50px;
            font-size: clamp(20px, 2.8vh, 38px);
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.10);
            letter-spacing: 0.5px;
            background: #F5F9FF;
            color: #2C4A6B;
            border: 4px solid rgba(255, 255, 255, 0.8);
        }
        .mode-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 0 rgba(0, 0, 0, 0.10);
        }
        .mode-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.10);
        }
        .mode-btn.active {
            background: #FFD93D;
            border-color: #F5B700;
            color: #1F3A4B;
            box-shadow: 0 8px 0 #C99A00;
        }
        .mode-btn.active:hover {
            box-shadow: 0 10px 0 #C99A00;
        }

        .score-badge {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            padding: 10px 28px;
            border-radius: 50px;
            font-size: clamp(20px, 2.8vh, 38px);
            font-weight: 600;
            color: #1F3A4B;
            border: 4px solid rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .score-badge span {
            color: #E85D3A;
            font-weight: 800;
            font-size: clamp(28px, 3.6vh, 50px);
        }

        .scene-wrap {
            flex: 1 1 auto;
            position: relative;
            min-height: 0;
            overflow: hidden;
        }

        .scene {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 26%;
            background: linear-gradient(0deg, #4A9A4A 0%, #6BBF6B 30%, #7CCD7C 60%, #A8E6A8 100%);
            border-top: 8px solid #3A8A3A;
            border-radius: 60% 60% 0 0 / 40px 40px 0 0;
        }
        .ground::before {
            content: '';
            position: absolute;
            top: -16px;
            left: 0;
            width: 100%;
            height: 40px;
            background: radial-gradient(ellipse at 20% 100%, #6BBF6B 0%, transparent 70%),
                radial-gradient(ellipse at 80% 100%, #6BBF6B 0%, transparent 70%);
            opacity: 0.6;
        }

        .grass-blades {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .grass-blades::after {
            content: '🌿🌱🌾🌱🌿🌾🌱🌿🌾🌱🌿🌾🌱🌿🌾🌱🌿🌾🌱🌿🌾🌱🌿🌾🌱🌿🌾🌱🌿🌾';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            font-size: clamp(34px, 5vh, 70px);
            letter-spacing: clamp(16px, 2.5vw, 50px);
            opacity: 0.45;
            animation: grassSway 6s ease-in-out infinite alternate;
            white-space: nowrap;
        }
        @keyframes grassSway {
            0% {
                transform: translateX(0) rotate(-1deg);
            }
            100% {
                transform: translateX(-10%) rotate(1deg);
            }
        }

        /* SUN */
        .sun {
            position: absolute;
            top: 3%;
            right: 6%;
            width: clamp(140px, 20vw, 260px);
            height: clamp(140px, 20vw, 260px);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #FFED7A, #FFD700 50%, #F5A623);
            box-shadow: 0 0 100px rgba(255, 215, 0, 0.9), 0 0 200px rgba(255, 215, 0, 0.5);
            opacity: 0;
            transform: scale(0.3);
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
        }
        .sun.visible {
            opacity: 1;
            transform: scale(1);
        }
        .sun::after {
            content: '';
            position: absolute;
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 200, 0.5), transparent 70%);
            animation: sunGlow 3s ease-in-out infinite alternate;
        }
        @keyframes sunGlow {
            0% {
                transform: scale(1);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.5);
                opacity: 1;
            }
        }

        .sun-rays {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 280%;
            height: 280%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg,
                    transparent 0deg, transparent 5deg,
                    rgba(255, 215, 0, 0.25) 5deg, rgba(255, 215, 0, 0.25) 7deg);
            animation: spinRays 18s linear infinite;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .sun-rays.visible {
            opacity: 1;
        }
        @keyframes spinRays {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* CLOUDS – bigger & more fluffy */
        .cloud {
            position: absolute;
            font-size: clamp(100px, 15vw, 200px);
            opacity: 0;
            transform: translateX(-40px) scale(0.8);
            transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 8px 30px rgba(0, 0, 0, 0.10));
            z-index: 3;
            pointer-events: none;
        }
        .cloud.visible {
            opacity: 0.95;
            transform: translateX(0) scale(1);
        }
        .cloud.c1 {
            top: 5%;
            left: 2%;
            animation: cloudDrift1 18s ease-in-out infinite alternate;
        }
        .cloud.c2 {
            top: 16%;
            left: 28%;
            font-size: clamp(80px, 11vw, 150px);
            animation: cloudDrift2 22s ease-in-out infinite alternate;
        }
        .cloud.c3 {
            top: 2%;
            left: 58%;
            font-size: clamp(90px, 12vw, 170px);
            animation: cloudDrift3 20s ease-in-out infinite alternate;
        }
        @keyframes cloudDrift1 {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(80px);
            }
        }
        @keyframes cloudDrift2 {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-60px);
            }
        }
        @keyframes cloudDrift3 {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(50px);
            }
        }

        /* RAIN – more drops, thicker */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 4;
        }
        .rain-container.visible {
            opacity: 1;
        }
        .raindrop {
            position: absolute;
            top: -10%;
            width: 4px;
            background: linear-gradient(180deg, rgba(180, 210, 255, 0.95), rgba(70, 140, 255, 0.6));
            border-radius: 4px;
            animation: rainFall linear infinite;
        }
        @keyframes rainFall {
            0% {
                transform: translateY(0) rotate(10deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(10deg);
                opacity: 0.2;
            }
        }

        /* SNOW – larger flakes */
        .snow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 4;
        }
        .snow-container.visible {
            opacity: 1;
        }
        .snowflake {
            position: absolute;
            top: -10%;
            color: white;
            font-size: clamp(32px, 5vh, 64px);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
            animation: snowFall linear infinite;
            opacity: 0.95;
        }
        @keyframes snowFall {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 0.95;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(0.5);
                opacity: 0.2;
            }
        }

        /* WIND – thicker, more visible */
        .wind-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 4;
        }
        .wind-container.visible {
            opacity: 1;
        }
        .wind-line {
            position: absolute;
            height: 8px;
            border-radius: 8px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), rgba(200, 230, 255, 0.6), transparent);
            animation: windBlow linear infinite;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        @keyframes windBlow {
            0% {
                transform: translateX(-20%) scaleX(0.3);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                transform: translateX(140%) scaleX(1.6);
                opacity: 0;
            }
        }

        /* decorative clouds */
        .scene-cloud {
            position: absolute;
            font-size: clamp(70px, 10vw, 130px);
            opacity: 0.25;
            pointer-events: none;
            z-index: 1;
            filter: blur(1.5px);
        }
        .scene-cloud.s1 {
            top: 1%;
            left: 1%;
            animation: cloudDrift1 25s ease-in-out infinite alternate;
        }
        .scene-cloud.s2 {
            bottom: 32%;
            right: 1%;
            font-size: clamp(50px, 8vw, 100px);
            animation: cloudDrift2 28s ease-in-out infinite alternate;
            opacity: 0.2;
        }

        /* TEACHER – bigger */
        .teacher {
            position: absolute;
            bottom: 26%;
            left: 3%;
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
            pointer-events: none;
        }
        .teacher-avatar {
            font-size: clamp(100px, 15vw, 200px);
            line-height: 1;
            filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.15));
            animation: teacherBob 3s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes teacherBob {
            0%,
            100% {
                transform: translateY(0) rotate(-3deg);
            }
            50% {
                transform: translateY(-16px) rotate(3deg);
            }
        }

        .speech-bubble {
            background: white;
            padding: 22px 36px;
            border-radius: 40px 40px 40px 12px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.15);
            max-width: clamp(320px, 44vw, 600px);
            font-size: clamp(26px, 3.6vh, 48px);
            font-weight: 700;
            color: #1F3A4B;
            margin-bottom: 10px;
            position: relative;
            border: 5px solid rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(6px);
            transition: all 0.3s ease;
            pointer-events: none;
            line-height: 1.4;
            text-align: center;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -24px;
            left: 28px;
            border: 16px solid transparent;
            border-top-color: white;
            border-bottom: 0;
            filter: drop-shadow(0 8px 8px rgba(0, 0, 0, 0.05));
        }
        .speech-bubble .tatar {
            font-weight: 800;
            color: #C0392B;
        }
        .speech-bubble .eng {
            font-weight: 400;
            color: #4A6A85;
            font-size: 0.7em;
            display: block;
            margin-top: 6px;
        }
        .speech-bubble .highlight {
            color: #E85D3A;
            font-weight: 800;
        }

        /* CARDS – even bigger */
        .cards-bar {
            flex: 0 0 auto;
            padding: 18px 24px 24px 24px;
            display: flex;
            justify-content: center;
            gap: clamp(16px, 2.2vw, 40px);
            z-index: 20;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            border-top: 5px solid rgba(255, 255, 255, 0.35);
        }

        .weather-card {
            flex: 0 1 auto;
            min-width: clamp(120px, 16vw, 210px);
            padding: 20px 16px 22px 16px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            border: 6px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .weather-card:hover {
            transform: translateY(-10px) scale(1.06);
            box-shadow: 0 16px 56px rgba(0, 0, 0, 0.18);
            border-color: #FFD93D;
        }
        .weather-card:active {
            transform: scale(0.90);
            transition-duration: 0.05s;
        }
        .weather-card .card-icon {
            font-size: clamp(56px, 8vw, 110px);
            line-height: 1.2;
        }
        .weather-card .card-label {
            font-size: clamp(24px, 2.8vh, 40px);
            font-weight: 700;
            color: #1F3A4B;
            line-height: 1.2;
        }
        .weather-card .card-label .tatar {
            color: #C0392B;
        }
        .weather-card .card-label .eng {
            font-weight: 400;
            color: #4A6A85;
            font-size: 0.7em;
            display: block;
        }
        .weather-card.active {
            border-color: #FFD93D;
            background: #FFF8E1;
            box-shadow: 0 0 0 8px rgba(255, 215, 0, 0.35), 0 16px 56px rgba(0, 0, 0, 0.15);
            transform: scale(1.08);
        }
        .weather-card.correct {
            border-color: #2ECC71;
            background: #EAFAF1;
            animation: popCorrect 0.6s ease;
        }
        .weather-card.wrong {
            border-color: #E74C3C;
            background: #FDEDEC;
            animation: shakeWrong 0.6s ease;
        }
        .weather-card.disabled {
            pointer-events: none;
            opacity: 0.5;
            transform: scale(0.92);
        }

        @keyframes popCorrect {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.35);
            }
            60% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1.08);
            }
        }
        @keyframes shakeWrong {
            0%,
            100% {
                transform: translateX(0) scale(1.08);
            }
            20% {
                transform: translateX(-24px) scale(1.08);
            }
            40% {
                transform: translateX(24px) scale(1.08);
            }
            60% {
                transform: translateX(-14px) scale(1.08);
            }
            80% {
                transform: translateX(14px) scale(1.08);
            }
        }

        .weather-card[data-weather="sunny"] {
            border-color: #FFD93D;
        }
        .weather-card[data-weather="rainy"] {
            border-color: #5B9BD5;
        }
        .weather-card[data-weather="cloudy"] {
            border-color: #B0BEC5;
        }
        .weather-card[data-weather="snowy"] {
            border-color: #CFE7FF;
        }
        .weather-card[data-weather="windy"] {
            border-color: #AED6F1;
        }
        .weather-card[data-weather="sunny"].active {
            border-color: #FFD93D;
            background: #FFF8E1;
        }
        .weather-card[data-weather="rainy"].active {
            border-color: #5B9BD5;
            background: #E3F0FD;
        }
        .weather-card[data-weather="cloudy"].active {
            border-color: #90A4AE;
            background: #F0F2F4;
        }
        .weather-card[data-weather="snowy"].active {
            border-color: #B3D9FF;
            background: #F0F8FF;
        }
        .weather-card[data-weather="windy"].active {
            border-color: #85C1E9;
            background: #EBF5FB;
        }

        /* CONFETTI */
        .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
            overflow: hidden;
        }
        .confetti-piece {
            position: absolute;
            top: -10%;
            width: 18px;
            height: 18px;
            border-radius: 4px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(0.3);
                opacity: 0;
            }
        }

        /* TREES */
        .tree {
            position: absolute;
            font-size: clamp(60px, 10vw, 140px);
            pointer-events: none;
            z-index: 2;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.10));
        }
        .tree.t1 {
            bottom: 22%;
            left: 12%;
            animation: treeSway1 4s ease-in-out infinite alternate;
        }
        .tree.t2 {
            bottom: 20%;
            right: 8%;
            font-size: clamp(50px, 8vw, 110px);
            animation: treeSway2 5s ease-in-out infinite alternate;
        }
        @keyframes treeSway1 {
            0% {
                transform: rotate(-5deg);
            }
            100% {
                transform: rotate(5deg);
            }
        }
        @keyframes treeSway2 {
            0% {
                transform: rotate(4deg);
            }
            100% {
                transform: rotate(-6deg);
            }
        }

        /* FLOWERS */
        .flower {
            position: absolute;
            font-size: clamp(30px, 4vw, 60px);
            pointer-events: none;
            z-index: 3;
            opacity: 0.75;
            animation: flowerSway 3s ease-in-out infinite alternate;
        }
        .flower.f1 {
            bottom: 18%;
            left: 25%;
        }
        .flower.f2 {
            bottom: 16%;
            left: 45%;
            animation-delay: 0.7s;
        }
        .flower.f3 {
            bottom: 20%;
            right: 30%;
            animation-delay: 1.2s;
        }
        .flower.f4 {
            bottom: 14%;
            left: 70%;
            animation-delay: 0.4s;
        }
        @keyframes flowerSway {
            0% {
                transform: rotate(-8deg);
            }
            100% {
                transform: rotate(8deg);
            }
        }

        /* Preview flash for quiz */
        .weather-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(120px, 20vw, 300px);
            opacity: 0;
            transition: opacity 0.3s ease;
            background: rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(2px);
            border-radius: 20px;
            text-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
        }
        .weather-flash.active {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 820px) {
            .header {
                padding: 10px 18px 8px 18px;
            }
            .header-title .sub {
                display: none;
            }
            .cards-bar {
                padding: 10px 12px 14px 12px;
                gap: 10px;
            }
            .weather-card {
                min-width: 80px;
                padding: 12px 8px 14px 8px;
                border-radius: 24px;
                border-width: 5px;
            }
            .weather-card .card-icon {
                font-size: clamp(38px, 7vw, 64px);
            }
            .weather-card .card-label {
                font-size: clamp(16px, 2vh, 26px);
            }
            .speech-bubble {
                font-size: clamp(18px, 2.4vh, 28px);
                padding: 14px 20px;
                max-width: 240px;
                border-radius: 28px 28px 28px 8px;
            }
            .teacher {
                bottom: 24%;
                left: 2%;
            }
            .teacher-avatar {
                font-size: clamp(60px, 10vw, 100px);
            }
            .mode-btn {
                padding: 8px 20px;
                font-size: clamp(16px, 2vh, 26px);
            }
            .score-badge {
                padding: 8px 16px;
                font-size: clamp(16px, 2vh, 26px);
            }
            .score-badge span {
                font-size: clamp(20px, 2.6vh, 34px);
            }
            .ground {
                height: 22%;
            }
            .sun {
                width: clamp(100px, 16vw, 180px);
                height: clamp(100px, 16vw, 180px);
            }
            .cloud {
                font-size: clamp(60px, 10vw, 120px);
            }
            .cloud.c2 {
                font-size: clamp(50px, 8vw, 100px);
            }
            .cloud.c3 {
                font-size: clamp(55px, 9vw, 110px);
            }
            .tree {
                font-size: clamp(40px, 7vw, 80px);
            }
            .flower {
                font-size: clamp(22px, 3vw, 40px);
            }
            .snowflake {
                font-size: clamp(22px, 3.5vh, 44px);
            }
            .raindrop {
                width: 3px;
            }
            .wind-line {
                height: 6px;
            }
        }

        @media (max-width: 480px) {
            .header-title {
                font-size: clamp(22px, 3.6vh, 36px);
            }
            .header-title .icon-big {
                font-size: clamp(28px, 4vh, 44px);
            }
            .weather-card {
                min-width: 60px;
                padding: 8px 4px 10px 4px;
                border-radius: 16px;
                border-width: 4px;
            }
            .weather-card .card-icon {
                font-size: clamp(28px, 6vw, 44px);
            }
            .weather-card .card-label {
                font-size: clamp(12px, 1.6vh, 18px);
            }
            .speech-bubble {
                font-size: clamp(14px, 2vh, 20px);
                padding: 10px 14px;
                max-width: 160px;
                border-radius: 20px 20px 20px 6px;
            }
            .teacher-avatar {
                font-size: clamp(44px, 8vw, 64px);
            }
            .mode-btn {
                padding: 6px 12px;
                font-size: clamp(12px, 1.6vh, 18px);
            }
            .score-badge {
                padding: 4px 12px;
                font-size: clamp(12px, 1.6vh, 18px);
            }
            .score-badge span {
                font-size: clamp(16px, 2vh, 24px);
            }
            .cards-bar {
                gap: 6px;
                padding: 6px 6px 10px 6px;
            }
            .header {
                padding: 4px 8px 2px 8px;
            }
            .ground {
                height: 18%;
            }
            .sun {
                width: clamp(60px, 12vw, 100px);
                height: clamp(60px, 12vw, 100px);
            }
            .cloud {
                font-size: clamp(40px, 8vw, 70px);
            }
            .cloud.c2 {
                font-size: clamp(32px, 6vw, 60px);
            }
            .cloud.c3 {
                font-size: clamp(36px, 7vw, 65px);
            }
            .tree {
                font-size: clamp(28px, 6vw, 50px);
            }
            .flower {
                font-size: clamp(16px, 3vw, 28px);
            }
            .snowflake {
                font-size: clamp(16px, 2.8vh, 30px);
            }
            .raindrop {
                width: 2px;
            }
            .wind-line {
                height: 4px;
            }
        }

        .fade-transition {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- HEADER -->
        <header class="header">
            <div class="header-title">
                <span class="icon-big">🌤️</span>
                <span>Weather in Tatar</span>
                <span class="sub">Һава торышы</span>
            </div>
            <div class="header-controls">
                <button class="mode-btn active" data-mode="explore" id="modeExplore">🔍 Explore</button>
                <button class="mode-btn" data-mode="quiz" id="modeQuiz">🎯 Find it!</button>
                <div class="score-badge" id="scoreBadge">
                    ⭐ <span id="scoreDisplay">0</span>
                </div>
            </div>
        </header>

        <!-- SCENE -->
        <div class="scene-wrap">
            <div class="scene" id="scene">

                <!-- background clouds -->
                <div class="scene-cloud s1">☁️</div>
                <div class="scene-cloud s2">☁️</div>

                <!-- sun -->
                <div class="sun-rays" id="sunRays"></div>
                <div class="sun" id="sun"></div>

                <!-- clouds -->
                <div class="cloud c1" id="cloud1">☁️</div>
                <div class="cloud c2" id="cloud2">☁️</div>
                <div class="cloud c3" id="cloud3">☁️</div>

                <!-- rain -->
                <div class="rain-container" id="rainContainer"></div>

                <!-- snow -->
                <div class="snow-container" id="snowContainer"></div>

                <!-- wind -->
                <div class="wind-container" id="windContainer"></div>

                <!-- trees & flowers -->
                <div class="tree t1">🌳</div>
                <div class="tree t2">🌲</div>
                <div class="flower f1">🌷</div>
                <div class="flower f2">🌻</div>
                <div class="flower f3">🌸</div>
                <div class="flower f4">🌺</div>

                <!-- ground -->
                <div class="ground">
                    <div class="grass-blades"></div>
                </div>

                <!-- TEACHER -->
                <div class="teacher" id="teacher">
                    <div class="speech-bubble" id="speechBubble">
                        <span id="bubbleText">👋 Сәлам!<span class="eng">Hello!</span></span>
                    </div>
                    <div class="teacher-avatar">🦉</div>
                </div>

                <!-- weather flash for quiz preview -->
                <div class="weather-flash" id="weatherFlash"></div>

                <!-- confetti -->
                <div class="confetti-container" id="confettiContainer"></div>
            </div>
        </div>

        <!-- CARDS -->
        <div class="cards-bar" id="cardsBar">
            <div class="weather-card" data-weather="sunny" data-tatar="Кояшлы" data-eng="Sunny">
                <span class="card-icon">☀️</span>
                <span class="card-label">
                    <span class="tatar">Кояшлы</span>
                    <span class="eng">Sunny</span>
                </span>
            </div>
            <div class="weather-card" data-weather="rainy" data-tatar="Яңгырлы" data-eng="Rainy">
                <span class="card-icon">🌧️</span>
                <span class="card-label">
                    <span class="tatar">Яңгырлы</span>
                    <span class="eng">Rainy</span>
                </span>
            </div>
            <div class="weather-card" data-weather="cloudy" data-tatar="Болытлы" data-eng="Cloudy">
                <span class="card-icon">☁️</span>
                <span class="card-label">
                    <span class="tatar">Болытлы</span>
                    <span class="eng">Cloudy</span>
                </span>
            </div>
            <div class="weather-card" data-weather="snowy" data-tatar="Карлы" data-eng="Snowy">
                <span class="card-icon">❄️</span>
                <span class="card-label">
                    <span class="tatar">Карлы</span>
                    <span class="eng">Snowy</span>
                </span>
            </div>
            <div class="weather-card" data-weather="windy" data-tatar="Җилле" data-eng="Windy">
                <span class="card-icon">🌬️</span>
                <span class="card-label">
                    <span class="tatar">Җилле</span>
                    <span class="eng">Windy</span>
                </span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const WEATHERS = {
                sunny: { icon: '☀️', tatar: 'Кояшлы', eng: 'Sunny', emoji: '☀️' },
                rainy: { icon: '🌧️', tatar: 'Яңгырлы', eng: 'Rainy', emoji: '🌧️' },
                cloudy: { icon: '☁️', tatar: 'Болытлы', eng: 'Cloudy', emoji: '☁️' },
                snowy: { icon: '❄️', tatar: 'Карлы', eng: 'Snowy', emoji: '❄️' },
                windy: { icon: '🌬️', tatar: 'Җилле', eng: 'Windy', emoji: '🌬️' }
            };
            const WEATHER_LIST = ['sunny', 'rainy', 'cloudy', 'snowy', 'windy'];

            const scene = document.getElementById('scene');
            const sun = document.getElementById('sun');
            const sunRays = document.getElementById('sunRays');
            const cloud1 = document.getElementById('cloud1');
            const cloud2 = document.getElementById('cloud2');
            const cloud3 = document.getElementById('cloud3');
            const rainContainer = document.getElementById('rainContainer');
            const snowContainer = document.getElementById('snowContainer');
            const windContainer = document.getElementById('windContainer');
            const speechBubble = document.getElementById('speechBubble');
            const bubbleText = document.getElementById('bubbleText');
            const cards = document.querySelectorAll('.weather-card');
            const modeExplore = document.getElementById('modeExplore');
            const modeQuiz = document.getElementById('modeQuiz');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const confettiContainer = document.getElementById('confettiContainer');
            const weatherFlash = document.getElementById('weatherFlash');

            let currentWeather = 'sunny';
            let mode = 'explore';
            let score = 0;
            let quizActive = false;
            let quizTarget = '';
            let quizLocked = false;
            let rainDrops = [];
            let snowFlakes = [];
            let windLines = [];
            let flashTimeout = null;

            // --- core weather display ---
            function setWeather(weather, fromQuiz, flash = false) {
                currentWeather = weather;
                const data = WEATHERS[weather];

                cards.forEach(c => {
                    c.classList.toggle('active', c.dataset.weather === weather);
                    if (!fromQuiz) {
                        c.classList.remove('correct', 'wrong', 'disabled');
                    }
                });

                const isSunny = weather === 'sunny';
                sun.classList.toggle('visible', isSunny);
                sunRays.classList.toggle('visible', isSunny);

                const showClouds = weather === 'cloudy' || weather === 'rainy' || weather === 'snowy' || weather === 'windy';
                cloud1.classList.toggle('visible', showClouds);
                cloud2.classList.toggle('visible', showClouds);
                cloud3.classList.toggle('visible', showClouds);

                const isRainy = weather === 'rainy';
                rainContainer.classList.toggle('visible', isRainy);
                if (isRainy) startRain();
                else stopRain();

                const isSnowy = weather === 'snowy';
                snowContainer.classList.toggle('visible', isSnowy);
                if (isSnowy) startSnow();
                else stopSnow();

                const isWindy = weather === 'windy';
                windContainer.classList.toggle('visible', isWindy);
                if (isWindy) startWind();
                else stopWind();

                if (!fromQuiz) {
                    if (mode === 'explore') speakExplore(weather);
                }

                // Flash effect for quiz preview
                if (flash) {
                    showFlash(weather);
                }
            }

            // --- weather effects ---
            function startRain() {
                stopRain();
                const count = 130;
                for (let i = 0; i < count; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'raindrop';
                    const left = Math.random() * 100;
                    const dur = 0.4 + Math.random() * 0.8;
                    const delay = Math.random() * 2;
                    const height = 14 + Math.random() * 24;
                    drop.style.left = left + '%';
                    drop.style.animationDuration = dur + 's';
                    drop.style.animationDelay = delay + 's';
                    drop.style.height = height + 'px';
                    drop.style.opacity = 0.3 + Math.random() * 0.6;
                    rainContainer.appendChild(drop);
                    rainDrops.push(drop);
                }
            }

            function stopRain() {
                rainDrops.forEach(d => d.remove());
                rainDrops = [];
                rainContainer.innerHTML = '';
            }

            function startSnow() {
                stopSnow();
                const count = 90;
                for (let i = 0; i < count; i++) {
                    const flake = document.createElement('div');
                    flake.className = 'snowflake';
                    flake.textContent = ['❄', '❅', '❆', '✦'][Math.floor(Math.random() * 4)];
                    const left = Math.random() * 100;
                    const dur = 4 + Math.random() * 8;
                    const delay = Math.random() * 5;
                    const size = 24 + Math.random() * 40;
                    flake.style.left = left + '%';
                    flake.style.animationDuration = dur + 's';
                    flake.style.animationDelay = delay + 's';
                    flake.style.fontSize = size + 'px';
                    flake.style.opacity = 0.5 + Math.random() * 0.5;
                    snowContainer.appendChild(flake);
                    snowFlakes.push(flake);
                }
            }

            function stopSnow() {
                snowFlakes.forEach(f => f.remove());
                snowFlakes = [];
                snowContainer.innerHTML = '';
            }

            function startWind() {
                stopWind();
                const count = 40;
                for (let i = 0; i < count; i++) {
                    const line = document.createElement('div');
                    line.className = 'wind-line';
                    const top = 5 + Math.random() * 80;
                    const dur = 1.5 + Math.random() * 3;
                    const delay = Math.random() * 5;
                    const width = 100 + Math.random() * 220;
                    const opacity = 0.25 + Math.random() * 0.5;
                    line.style.top = top + '%';
                    line.style.animationDuration = dur + 's';
                    line.style.animationDelay = delay + 's';
                    line.style.width = width + 'px';
                    line.style.opacity = opacity;
                    windContainer.appendChild(line);
                    windLines.push(line);
                }
            }

            function stopWind() {
                windLines.forEach(l => l.remove());
                windLines = [];
                windContainer.innerHTML = '';
            }

            // --- flash preview for quiz ---
            function showFlash(weather) {
                const data = WEATHERS[weather];
                weatherFlash.textContent = data.icon;
                weatherFlash.classList.add('active');
                clearTimeout(flashTimeout);
                flashTimeout = setTimeout(() => {
                    weatherFlash.classList.remove('active');
                }, 1000);
            }

            // --- speech ---
            function speakExplore(weather) {
                const data = WEATHERS[weather];
                bubbleText.innerHTML = `
                    Бүген һава <span class="highlight">${data.tatar}</span> ${data.icon}
                    <span class="eng">Today's weather is <strong>${data.eng}</strong></span>
                `;
            }

            function speakQuizQuestion(target) {
                const data = WEATHERS[target];
                bubbleText.innerHTML = `
                    🧐 <span class="tatar">Кайсы?</span> <span class="highlight">${data.tatar}</span> ?
                    <span class="eng">Where is <strong>${data.eng}</strong>?</span>
                `;
            }

            function speakQuizCorrect(weather) {
                const data = WEATHERS[weather];
                bubbleText.innerHTML = `
                    🎉 <span class="tatar">Әфәрин!</span> ${data.tatar}! ⭐
                    <span class="eng">Well done! <strong>${data.eng}</strong>!</span>
                `;
            }

            function speakQuizWrong(weather) {
                const data = WEATHERS[weather];
                bubbleText.innerHTML = `
                    🤔 <span class="tatar">Тагын кара</span> 
                    <span class="eng">Look again, that's <strong>${data.eng}</strong></span>
                `;
            }

            function speakWelcome() {
                bubbleText.innerHTML = `
                    👋 Сәлам! <span class="tatar">Һава торышы</span> 
                    <span class="eng">Let's learn weather in Tatar!</span>
                `;
            }

            function speakExplorePrompt() {
                bubbleText.innerHTML = `
                    👆 Карточканы бас!
                    <span class="eng">Tap a card to see the weather</span>
                `;
            }

            function speakQuizStart() {
                bubbleText.innerHTML = `
                    🎯 <span class="tatar">Кайсы?</span> 
                    <span class="eng">Find the weather I say!</span>
                `;
            }

            // --- quiz logic ---
            function startQuizRound() {
                if (quizLocked) return;
                const idx = Math.floor(Math.random() * WEATHER_LIST.length);
                quizTarget = WEATHER_LIST[idx];
                cards.forEach(c => {
                    c.classList.remove('correct', 'wrong', 'disabled');
                });
                quizActive = true;
                quizLocked = false;

                // Show a flash preview of the target weather
                setWeather(quizTarget, true, true);
                // Then after flash, ask the question
                setTimeout(() => {
                    speakQuizQuestion(quizTarget);
                }, 1000);
            }

            function handleQuizClick(card) {
                if (quizLocked) return;
                if (!quizActive) return;
                const weather = card.dataset.weather;
                if (weather === quizTarget) {
                    quizLocked = true;
                    card.classList.add('correct');
                    score++;
                    scoreDisplay.textContent = score;
                    speakQuizCorrect(weather);
                    fireConfetti();
                    // Also flash the correct weather again
                    showFlash(weather);
                    setTimeout(() => {
                        card.classList.remove('correct');
                        quizLocked = false;
                        if (mode === 'quiz') startQuizRound();
                        else quizActive = false;
                    }, 1800);
                } else {
                    card.classList.add('wrong');
                    speakQuizWrong(weather);
                    // Flash the wrong weather briefly to show what it is
                    showFlash(weather);
                    setTimeout(() => {
                        card.classList.remove('wrong');
                    }, 800);
                }
            }

            // --- confetti ---
            function fireConfetti() {
                const colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF6BD6', '#FF9F43', '#A29BFE'];
                const container = confettiContainer;
                for (let i = 0; i < 80; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    const size = 10 + Math.random() * 22;
                    const left = Math.random() * 100;
                    const dur = 1.8 + Math.random() * 2.2;
                    const delay = Math.random() * 0.8;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const rotate = Math.random() * 360;
                    piece.style.left = left + '%';
                    piece.style.width = size + 'px';
                    piece.style.height = size * (0.4 + Math.random() * 0.8) + 'px';
                    piece.style.background = color;
                    piece.style.animationDuration = dur + 's';
                    piece.style.animationDelay = delay + 's';
                    piece.style.transform = 'rotate(' + rotate + 'deg)';
                    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    container.appendChild(piece);
                    setTimeout(() => piece.remove(), (dur + delay) * 1000 + 300);
                }
            }

            // --- card click ---
            function onCardClick(e) {
                const card = e.currentTarget;
                if (card.classList.contains('disabled')) return;
                const weather = card.dataset.weather;

                if (mode === 'explore') {
                    setWeather(weather, false);
                } else if (mode === 'quiz') {
                    if (!quizActive) {
                        // start a new quiz with this weather as target? but we want random
                        // better to just start a random round
                        quizActive = true;
                        quizTarget = weather; // but we will override in startQuizRound
                        startQuizRound();
                        return;
                    }
                    handleQuizClick(card);
                }
            }

            // --- mode switching ---
            function setMode(newMode) {
                mode = newMode;
                modeExplore.classList.toggle('active', mode === 'explore');
                modeQuiz.classList.toggle('active', mode === 'quiz');
                cards.forEach(c => {
                    c.classList.remove('correct', 'wrong', 'disabled');
                });

                if (mode === 'explore') {
                    quizActive = false;
                    quizLocked = false;
                    setWeather(currentWeather, false);
                    speakExplorePrompt();
                } else {
                    quizActive = false;
                    quizLocked = false;
                    speakQuizStart();
                    setTimeout(() => {
                        if (mode === 'quiz') startQuizRound();
                    }, 700);
                }
            }

            // --- keyboard ---
            function onKeyDown(e) {
                if (e.key === 'e' || e.key === 'E') { setMode('explore');
                    e.preventDefault(); }
                if (e.key === 'q' || e.key === 'Q') { setMode('quiz');
                    e.preventDefault(); }
                if (e.key >= '1' && e.key <= '5') {
                    const idx = parseInt(e.key) - 1;
                    if (idx < cards.length) cards[idx].click();
                }
            }

            // --- init ---
            function init() {
                setWeather('sunny', false);
                speakWelcome();
                cards.forEach(c => c.addEventListener('click', onCardClick));
                modeExplore.addEventListener('click', () => setMode('explore'));
                modeQuiz.addEventListener('click', () => setMode('quiz'));
                document.addEventListener('keydown', onKeyDown);
                setMode('explore');

                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        const w = currentWeather;
                        if (w === 'rainy') { stopRain();
                            startRain(); }
                        if (w === 'snowy') { stopSnow();
                            startSnow(); }
                        if (w === 'windy') { stopWind();
                            startWind(); }
                    }, 300);
                });
                cards.forEach((c, i) => {
                    c.setAttribute('aria-label', `Card ${i+1}: ${c.dataset.tatar} (${c.dataset.eng})`);
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
