<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weather in Tatar – Һава торышы</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            background: #7EC8E3;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #7EC8E3 0%, #B5E3F5 45%, #D6F0FA 70%, #F0F9FF 100%);
            position: relative;
            overflow: hidden;
        }

        .header {
            flex: 0 0 auto;
            padding: 12px 16px 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 4px solid rgba(255, 255, 255, 0.7);
            z-index: 20;
            flex-wrap: wrap;
            gap: 6px 12px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: clamp(20px, 4.5vw, 48px);
            font-weight: 700;
            color: #1F3A4B;
            text-shadow: 0 2px 12px rgba(255, 255, 255, 0.7);
            letter-spacing: 0.3px;
        }
        .header-title .icon-big {
            font-size: clamp(28px, 5vw, 56px);
        }
        .header-title .sub {
            font-size: clamp(12px, 2vw, 26px);
            font-weight: 400;
            color: #2C5A7A;
            margin-left: 4px;
            opacity: 0.9;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 40px;
            font-size: clamp(12px, 2vw, 26px);
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
            letter-spacing: 0.3px;
            background: #F5F9FF;
            color: #2C4A6B;
            border: 3px solid rgba(255, 255, 255, 0.8);
            touch-action: manipulation;
        }
        .mode-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.08);
        }
        .mode-btn.active {
            background: #FFD93D;
            border-color: #F5B700;
            color: #1F3A4B;
            box-shadow: 0 4px 0 #C99A00;
        }

        .score-badge {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: clamp(12px, 2vw, 26px);
            font-weight: 600;
            color: #1F3A4B;
            border: 3px solid rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .score-badge span {
            color: #E85D3A;
            font-weight: 800;
            font-size: clamp(16px, 2.6vw, 34px);
        }

        .scene-wrap {
            flex: 1 1 auto;
            position: relative;
            min-height: 0;
            overflow: hidden;
        }

        .scene {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 22%;
            background: linear-gradient(0deg, #4A9A4A 0%, #6BBF6B 30%, #7CCD7C 60%, #A8E6A8 100%);
            border-top: 6px solid #3A8A3A;
            border-radius: 60% 60% 0 0 / 30px 30px 0 0;
        }
        .ground::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 0;
            width: 100%;
            height: 30px;
            background: radial-gradient(ellipse at 20% 100%, #6BBF6B 0%, transparent 70%),
                radial-gradient(ellipse at 80% 100%, #6BBF6B 0%, transparent 70%);
            opacity: 0.5;
        }

        .grass-blades {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .grass-blades::after {
            content: '🌿🌱🌾🌱🌿🌾🌱🌿🌾🌱🌿🌾🌱🌿🌾🌱🌿🌾🌱🌿🌾🌱🌿🌾🌱🌿🌾';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            font-size: clamp(18px, 3.5vw, 50px);
            letter-spacing: clamp(10px, 2vw, 40px);
            opacity: 0.4;
            animation: grassSway 6s ease-in-out infinite alternate;
            white-space: nowrap;
        }
        @keyframes grassSway {
            0% {
                transform: translateX(0) rotate(-1deg);
            }
            100% {
                transform: translateX(-10%) rotate(1deg);
            }
        }

        /* SUN */
        .sun {
            position: absolute;
            top: 3%;
            right: 6%;
            width: clamp(80px, 18vw, 200px);
            height: clamp(80px, 18vw, 200px);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #FFED7A, #FFD700 50%, #F5A623);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.7), 0 0 120px rgba(255, 215, 0, 0.4);
            opacity: 0;
            transform: scale(0.3);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
        }
        .sun.visible {
            opacity: 1;
            transform: scale(1);
        }
        .sun::after {
            content: '';
            position: absolute;
            top: -25%;
            left: -25%;
            width: 150%;
            height: 150%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 200, 0.4), transparent 70%);
            animation: sunGlow 3s ease-in-out infinite alternate;
        }
        @keyframes sunGlow {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }
            100% {
                transform: scale(1.4);
                opacity: 1;
            }
        }

        .sun-rays {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 240%;
            height: 240%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg,
                    transparent 0deg, transparent 5deg,
                    rgba(255, 215, 0, 0.2) 5deg, rgba(255, 215, 0, 0.2) 7deg);
            animation: spinRays 18s linear infinite;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .sun-rays.visible {
            opacity: 1;
        }
        @keyframes spinRays {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* MAIN CLOUDS */
        .cloud {
            position: absolute;
            font-size: clamp(50px, 12vw, 160px);
            opacity: 0;
            transform: translateX(-30px) scale(0.8);
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.08));
            z-index: 3;
            pointer-events: none;
        }
        .cloud.visible {
            opacity: 0.95;
            transform: translateX(0) scale(1);
        }
        .cloud.c1 {
            top: 5%;
            left: 2%;
            animation: cloudDrift1 18s ease-in-out infinite alternate;
        }
        .cloud.c2 {
            top: 16%;
            left: 25%;
            font-size: clamp(40px, 10vw, 130px);
            animation: cloudDrift2 22s ease-in-out infinite alternate;
        }
        .cloud.c3 {
            top: 2%;
            left: 55%;
            font-size: clamp(45px, 11vw, 140px);
            animation: cloudDrift3 20s ease-in-out infinite alternate;
        }
        @keyframes cloudDrift1 {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(60px);
            }
        }
        @keyframes cloudDrift2 {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50px);
            }
        }
        @keyframes cloudDrift3 {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(40px);
            }
        }

        /* EXTRA CLOUDS (for cloudy) */
        .extra-clouds {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }
        .extra-cloud {
            position: absolute;
            font-size: clamp(24px, 5vw, 70px);
            opacity: 0;
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.05));
            transition: opacity 0.6s ease;
            animation: cloudDrift1 20s ease-in-out infinite alternate;
            pointer-events: none;
        }
        .extra-cloud.visible {
            opacity: 0.65;
        }
        .extra-cloud:nth-child(odd) {
            animation-name: cloudDrift2;
            animation-duration: 24s;
        }
        .extra-cloud:nth-child(3n) {
            animation-name: cloudDrift3;
            animation-duration: 28s;
        }

        /* RAIN */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 4;
        }
        .rain-container.visible {
            opacity: 1;
        }
        .raindrop {
            position: absolute;
            top: -10%;
            width: 3px;
            background: linear-gradient(180deg, rgba(180, 210, 255, 0.9), rgba(70, 140, 255, 0.5));
            border-radius: 3px;
            animation: rainFall linear infinite;
        }
        @keyframes rainFall {
            0% {
                transform: translateY(0) rotate(8deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(8deg);
                opacity: 0.2;
            }
        }

        /* SNOW */
        .snow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 4;
        }
        .snow-container.visible {
            opacity: 1;
        }
        .snowflake {
            position: absolute;
            top: -10%;
            color: white;
            font-size: clamp(20px, 4vh, 48px);
            text-shadow: 0 0 16px rgba(255, 255, 255, 0.8);
            animation: snowFall linear infinite;
            opacity: 0.9;
        }
        @keyframes snowFall {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 0.9;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(0.4);
                opacity: 0.2;
            }
        }

        /* WIND */
        .wind-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 4;
        }
        .wind-container.visible {
            opacity: 1;
        }
        .wind-line {
            position: absolute;
            height: 5px;
            border-radius: 5px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), rgba(200, 230, 255, 0.4), transparent);
            animation: windBlow linear infinite;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
        }
        @keyframes windBlow {
            0% {
                transform: translateX(-20%) scaleX(0.3);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                transform: translateX(130%) scaleX(1.4);
                opacity: 0;
            }
        }

        /* background clouds */
        .scene-cloud {
            position: absolute;
            font-size: clamp(40px, 8vw, 100px);
            opacity: 0.2;
            pointer-events: none;
            z-index: 1;
            filter: blur(1px);
        }
        .scene-cloud.s1 {
            top: 1%;
            left: 1%;
            animation: cloudDrift1 25s ease-in-out infinite alternate;
        }
        .scene-cloud.s2 {
            bottom: 30%;
            right: 1%;
            font-size: clamp(30px, 6vw, 80px);
            animation: cloudDrift2 28s ease-in-out infinite alternate;
            opacity: 0.15;
        }

        /* TEACHER */
        .teacher {
            position: absolute;
            bottom: 22%;
            left: 2%;
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            transform: scale(0.9);
            transform-origin: bottom left;
        }
        @media (min-width: 600px) {
            .teacher {
                transform: scale(1);
            }
        }
        .teacher-avatar {
            font-size: clamp(50px, 12vw, 160px);
            line-height: 1;
            filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.12));
            animation: teacherBob 3s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes teacherBob {
            0%,
            100% {
                transform: translateY(0) rotate(-3deg);
            }
            50% {
                transform: translateY(-12px) rotate(3deg);
            }
        }

        .speech-bubble {
            background: white;
            padding: 14px 18px;
            border-radius: 28px 28px 28px 8px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
            max-width: clamp(200px, 50vw, 480px);
            font-size: clamp(16px, 2.8vh, 38px);
            font-weight: 700;
            color: #1F3A4B;
            margin-bottom: 6px;
            position: relative;
            border: 4px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            pointer-events: none;
            line-height: 1.3;
            text-align: center;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -18px;
            left: 20px;
            border: 12px solid transparent;
            border-top-color: white;
            border-bottom: 0;
            filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.04));
        }
        .speech-bubble .tatar {
            font-weight: 800;
            color: #C0392B;
        }
        .speech-bubble .eng {
            font-weight: 400;
            color: #4A6A85;
            font-size: 0.7em;
            display: block;
            margin-top: 4px;
        }
        .speech-bubble .highlight {
            color: #E85D3A;
            font-weight: 800;
        }

        /* CARDS */
        .cards-bar {
            flex: 0 0 auto;
            padding: 10px 8px 14px 8px;
            display: flex;
            justify-content: center;
            gap: clamp(6px, 1.5vw, 24px);
            z-index: 20;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-top: 4px solid rgba(255, 255, 255, 0.3);
        }

        .weather-card {
            flex: 0 1 auto;
            min-width: clamp(70px, 14vw, 180px);
            padding: 10px 6px 12px 6px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 28px;
            border: 5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            text-align: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .weather-card:active {
            transform: scale(0.92);
            transition-duration: 0.05s;
        }
        .weather-card .card-icon {
            font-size: clamp(32px, 7vw, 90px);
            line-height: 1.2;
        }
        .weather-card .card-label {
            font-size: clamp(14px, 2.2vh, 30px);
            font-weight: 700;
            color: #1F3A4B;
            line-height: 1.2;
        }
        .weather-card .card-label .tatar {
            color: #C0392B;
        }
        .weather-card .card-label .eng {
            font-weight: 400;
            color: #4A6A85;
            font-size: 0.7em;
            display: block;
        }
        .weather-card.active {
            border-color: #FFD93D;
            background: #FFF8E1;
            box-shadow: 0 0 0 6px rgba(255, 215, 0, 0.3), 0 8px 32px rgba(0, 0, 0, 0.10);
            transform: scale(1.04);
        }
        .weather-card.correct {
            border-color: #2ECC71;
            background: #EAFAF1;
            animation: popCorrect 0.5s ease;
        }
        .weather-card.wrong {
            border-color: #E74C3C;
            background: #FDEDEC;
            animation: shakeWrong 0.5s ease;
        }
        .weather-card.disabled {
            pointer-events: none;
            opacity: 0.5;
            transform: scale(0.94);
        }

        @keyframes popCorrect {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.25);
            }
            60% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1.04);
            }
        }
        @keyframes shakeWrong {
            0%,
            100% {
                transform: translateX(0) scale(1.04);
            }
            20% {
                transform: translateX(-16px) scale(1.04);
            }
            40% {
                transform: translateX(16px) scale(1.04);
            }
            60% {
                transform: translateX(-10px) scale(1.04);
            }
            80% {
                transform: translateX(10px) scale(1.04);
            }
        }

        .weather-card[data-weather="sunny"] {
            border-color: #FFD93D;
        }
        .weather-card[data-weather="rainy"] {
            border-color: #5B9BD5;
        }
        .weather-card[data-weather="cloudy"] {
            border-color: #B0BEC5;
        }
        .weather-card[data-weather="snowy"] {
            border-color: #CFE7FF;
        }
        .weather-card[data-weather="windy"] {
            border-color: #AED6F1;
        }
        .weather-card[data-weather="sunny"].active {
            border-color: #FFD93D;
            background: #FFF8E1;
        }
        .weather-card[data-weather="rainy"].active {
            border-color: #5B9BD5;
            background: #E3F0FD;
        }
        .weather-card[data-weather="cloudy"].active {
            border-color: #90A4AE;
            background: #F0F2F4;
        }
        .weather-card[data-weather="snowy"].active {
            border-color: #B3D9FF;
            background: #F0F8FF;
        }
        .weather-card[data-weather="windy"].active {
            border-color: #85C1E9;
            background: #EBF5FB;
        }

        /* CONFETTI */
        .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
            overflow: hidden;
        }
        .confetti-piece {
            position: absolute;
            top: -10%;
            width: 14px;
            height: 14px;
            border-radius: 3px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(0.3);
                opacity: 0;
            }
        }

        /* FLASH overlay */
        .weather-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(80px, 20vw, 250px);
            opacity: 0;
            transition: opacity 0.3s ease;
            background: rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border-radius: 16px;
            text-shadow: 0 6px 30px rgba(0, 0, 0, 0.15);
        }
        .weather-flash.active {
            opacity: 1;
        }

        /* TREES */
        .tree {
            position: absolute;
            font-size: clamp(30px, 7vw, 100px);
            pointer-events: none;
            z-index: 2;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08));
        }
        .tree.t1 {
            bottom: 20%;
            left: 10%;
            animation: treeSway1 4s ease-in-out infinite alternate;
        }
        .tree.t2 {
            bottom: 18%;
            right: 6%;
            font-size: clamp(25px, 6vw, 80px);
            animation: treeSway2 5s ease-in-out infinite alternate;
        }
        @keyframes treeSway1 {
            0% {
                transform: rotate(-4deg);
            }
            100% {
                transform: rotate(4deg);
            }
        }
        @keyframes treeSway2 {
            0% {
                transform: rotate(3deg);
            }
            100% {
                transform: rotate(-5deg);
            }
        }

        /* FLOWERS */
        .flower {
            position: absolute;
            font-size: clamp(16px, 3.5vw, 44px);
            pointer-events: none;
            z-index: 3;
            opacity: 0.7;
            animation: flowerSway 3s ease-in-out infinite alternate;
        }
        .flower.f1 {
            bottom: 16%;
            left: 22%;
        }
        .flower.f2 {
            bottom: 14%;
            left: 42%;
            animation-delay: 0.7s;
        }
        .flower.f3 {
            bottom: 18%;
            right: 28%;
            animation-delay: 1.2s;
        }
        .flower.f4 {
            bottom: 12%;
            left: 68%;
            animation-delay: 0.4s;
        }
        @keyframes flowerSway {
            0% {
                transform: rotate(-6deg);
            }
            100% {
                transform: rotate(6deg);
            }
        }

        /* ─── responsive fine-tuning ─── */
        @media (max-width: 600px) {
            .header {
                padding: 6px 10px 4px 10px;
            }
            .header-title .sub {
                display: none;
            }
            .header-title {
                font-size: clamp(16px, 4vw, 28px);
            }
            .header-title .icon-big {
                font-size: clamp(22px, 5vw, 34px);
            }
            .mode-btn {
                padding: 4px 10px;
                font-size: clamp(10px, 2vw, 16px);
                border-width: 2px;
            }
            .score-badge {
                padding: 4px 10px;
                font-size: clamp(10px, 2vw, 16px);
                border-width: 2px;
            }
            .score-badge span {
                font-size: clamp(14px, 2.5vw, 22px);
            }
            .cards-bar {
                padding: 6px 4px 10px 4px;
                gap: 4px;
            }
            .weather-card {
                min-width: 56px;
                padding: 6px 3px 8px 3px;
                border-radius: 16px;
                border-width: 3px;
            }
            .weather-card .card-icon {
                font-size: clamp(22px, 6vw, 38px);
            }
            .weather-card .card-label {
                font-size: clamp(10px, 1.8vh, 16px);
            }
            .weather-card .card-label .eng {
                font-size: 0.6em;
            }
            .weather-card.active {
                transform: scale(1.02);
            }
            .speech-bubble {
                font-size: clamp(13px, 2.2vh, 20px);
                padding: 8px 12px;
                max-width: 140px;
                border-radius: 18px 18px 18px 4px;
                border-width: 3px;
            }
            .speech-bubble::after {
                bottom: -14px;
                left: 14px;
                border-width: 8px;
            }
            .teacher {
                bottom: 20%;
                left: 1%;
                transform: scale(0.7);
                transform-origin: bottom left;
            }
            .teacher-avatar {
                font-size: clamp(32px, 8vw, 52px);
            }
            .ground {
                height: 18%;
            }
            .sun {
                width: clamp(50px, 12vw, 80px);
                height: clamp(50px, 12vw, 80px);
                right: 4%;
            }
            .cloud {
                font-size: clamp(30px, 8vw, 60px);
            }
            .cloud.c2 {
                font-size: clamp(24px, 6vw, 50px);
            }
            .cloud.c3 {
                font-size: clamp(28px, 7vw, 55px);
            }
            .extra-cloud {
                font-size: clamp(16px, 4vw, 36px);
            }
            .tree {
                font-size: clamp(20px, 6vw, 40px);
            }
            .tree.t2 {
                font-size: clamp(16px, 5vw, 32px);
            }
            .flower {
                font-size: clamp(12px, 3vw, 22px);
            }
            .snowflake {
                font-size: clamp(14px, 3vh, 28px);
            }
            .raindrop {
                width: 2px;
                height: 10px;
            }
            .wind-line {
                height: 3px;
            }
            .weather-flash {
                font-size: clamp(60px, 18vw, 120px);
            }
        }

        @media (max-width: 400px) {
            .weather-card {
                min-width: 48px;
                padding: 4px 2px 6px 2px;
                border-radius: 12px;
                border-width: 2px;
            }
            .weather-card .card-icon {
                font-size: clamp(18px, 5vw, 28px);
            }
            .weather-card .card-label {
                font-size: clamp(8px, 1.6vh, 12px);
            }
            .speech-bubble {
                font-size: clamp(11px, 2vh, 16px);
                padding: 6px 8px;
                max-width: 110px;
            }
            .teacher {
                transform: scale(0.6);
            }
            .header-title {
                font-size: clamp(14px, 3.5vw, 20px);
            }
            .mode-btn {
                padding: 3px 8px;
                font-size: clamp(8px, 1.8vw, 12px);
            }
            .score-badge {
                padding: 3px 8px;
                font-size: clamp(8px, 1.8vw, 12px);
            }
            .score-badge span {
                font-size: clamp(12px, 2vw, 18px);
            }
            .cards-bar {
                gap: 3px;
                padding: 4px 2px 6px 2px;
            }
            .sun {
                width: clamp(40px, 10vw, 60px);
                height: clamp(40px, 10vw, 60px);
            }
            .cloud {
                font-size: clamp(24px, 7vw, 44px);
            }
            .cloud.c2 {
                font-size: clamp(18px, 5vw, 36px);
            }
            .cloud.c3 {
                font-size: clamp(20px, 6vw, 40px);
            }
            .extra-cloud {
                font-size: clamp(12px, 3.5vw, 26px);
            }
            .tree {
                font-size: clamp(16px, 5vw, 30px);
            }
            .flower {
                font-size: clamp(10px, 2.5vw, 18px);
            }
            .snowflake {
                font-size: clamp(12px, 2.5vh, 20px);
            }
        }

        .fade-transition {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- HEADER -->
        <header class="header">
            <div class="header-title">
                <span class="icon-big">🌤️</span>
                <span>Weather</span>
                <span class="sub">Һава</span>
            </div>
            <div class="header-controls">
                <button class="mode-btn active" data-mode="explore" id="modeExplore">🔍 Explore</button>
                <button class="mode-btn" data-mode="quiz" id="modeQuiz">🎯 Find</button>
                <div class="score-badge" id="scoreBadge">
                    ⭐ <span id="scoreDisplay">0</span>
                </div>
            </div>
        </header>

        <!-- SCENE -->
        <div class="scene-wrap">
            <div class="scene" id="scene">

                <!-- background clouds -->
                <div class="scene-cloud s1">☁️</div>
                <div class="scene-cloud s2">☁️</div>

                <!-- sun -->
                <div class="sun-rays" id="sunRays"></div>
                <div class="sun" id="sun"></div>

                <!-- main clouds -->
                <div class="cloud c1" id="cloud1">☁️</div>
                <div class="cloud c2" id="cloud2">☁️</div>
                <div class="cloud c3" id="cloud3">☁️</div>

                <!-- extra clouds container -->
                <div class="extra-clouds" id="extraClouds"></div>

                <!-- rain -->
                <div class="rain-container" id="rainContainer"></div>

                <!-- snow -->
                <div class="snow-container" id="snowContainer"></div>

                <!-- wind -->
                <div class="wind-container" id="windContainer"></div>

                <!-- trees & flowers -->
                <div class="tree t1">🌳</div>
                <div class="tree t2">🌲</div>
                <div class="flower f1">🌷</div>
                <div class="flower f2">🌻</div>
                <div class="flower f3">🌸</div>
                <div class="flower f4">🌺</div>

                <!-- ground -->
                <div class="ground">
                    <div class="grass-blades"></div>
                </div>

                <!-- TEACHER -->
                <div class="teacher" id="teacher">
                    <div class="speech-bubble" id="speechBubble">
                        <span id="bubbleText">👋 Сәлам!<span class="eng">Hello!</span></span>
                    </div>
                    <div class="teacher-avatar">🦉</div>
                </div>

                <!-- flash -->
                <div class="weather-flash" id="weatherFlash"></div>

                <!-- confetti -->
                <div class="confetti-container" id="confettiContainer"></div>
            </div>
        </div>

        <!-- CARDS -->
        <div class="cards-bar" id="cardsBar">
            <div class="weather-card" data-weather="sunny" data-tatar="Кояшлы" data-eng="Sunny">
                <span class="card-icon">☀️</span>
                <span class="card-label">
                    <span class="tatar">Кояшлы</span>
                    <span class="eng">Sunny</span>
                </span>
            </div>
            <div class="weather-card" data-weather="rainy" data-tatar="Яңгырлы" data-eng="Rainy">
                <span class="card-icon">🌧️</span>
                <span class="card-label">
                    <span class="tatar">Яңгырлы</span>
                    <span class="eng">Rainy</span>
                </span>
            </div>
            <div class="weather-card" data-weather="cloudy" data-tatar="Болытлы" data-eng="Cloudy">
                <span class="card-icon">☁️</span>
                <span class="card-label">
                    <span class="tatar">Болытлы</span>
                    <span class="eng">Cloudy</span>
                </span>
            </div>
            <div class="weather-card" data-weather="snowy" data-tatar="Карлы" data-eng="Snowy">
                <span class="card-icon">❄️</span>
                <span class="card-label">
                    <span class="tatar">Карлы</span>
                    <span class="eng">Snowy</span>
                </span>
            </div>
            <div class="weather-card" data-weather="windy" data-tatar="Җилле" data-eng="Windy">
                <span class="card-icon">🌬️</span>
                <span class="card-label">
                    <span class="tatar">Җилле</span>
                    <span class="eng">Windy</span>
                </span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const WEATHERS = {
                sunny: { icon: '☀️', tatar: 'Кояшлы', eng: 'Sunny', emoji: '☀️' },
                rainy: { icon: '🌧️', tatar: 'Яңгырлы', eng: 'Rainy', emoji: '🌧️' },
                cloudy: { icon: '☁️', tatar: 'Болытлы', eng: 'Cloudy', emoji: '☁️' },
                snowy: { icon: '❄️', tatar: 'Карлы', eng: 'Snowy', emoji: '❄️' },
                windy: { icon: '🌬️', tatar: 'Җилле', eng: 'Windy', emoji: '🌬️' }
            };
            const WEATHER_LIST = ['sunny', 'rainy', 'cloudy', 'snowy', 'windy'];

            const scene = document.getElementById('scene');
            const sun = document.getElementById('sun');
            const sunRays = document.getElementById('sunRays');
            const cloud1 = document.getElementById('cloud1');
            const cloud2 = document.getElementById('cloud2');
            const cloud3 = document.getElementById('cloud3');
            const extraClouds = document.getElementById('extraClouds');
            const rainContainer = document.getElementById('rainContainer');
            const snowContainer = document.getElementById('snowContainer');
            const windContainer = document.getElementById('windContainer');
            const speechBubble = document.getElementById('speechBubble');
            const bubbleText = document.getElementById('bubbleText');
            const cards = document.querySelectorAll('.weather-card');
            const modeExplore = document.getElementById('modeExplore');
            const modeQuiz = document.getElementById('modeQuiz');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const confettiContainer = document.getElementById('confettiContainer');
            const weatherFlash = document.getElementById('weatherFlash');

            let currentWeather = 'sunny';
            let mode = 'explore';
            let score = 0;
            let quizActive = false;
            let quizTarget = '';
            let quizLocked = false;
            let rainDrops = [];
            let snowFlakes = [];
            let windLines = [];
            let flashTimeout = null;
            let extraCloudElements = [];
            let isMobile = window.innerWidth < 600;

            // adjust effect counts for mobile
            function getEffectCount(base) {
                return isMobile ? Math.floor(base * 0.6) : base;
            }

            function updateExtraClouds(weather) {
                extraCloudElements.forEach(el => el.remove());
                extraCloudElements = [];
                if (weather === 'cloudy') {
                    const count = isMobile ? 6 : 10;
                    for (let i = 0; i < count; i++) {
                        const cloud = document.createElement('div');
                        cloud.className = 'extra-cloud visible';
                        cloud.textContent = '☁️';
                        const left = 5 + Math.random() * 85;
                        const top = 2 + Math.random() * 70;
                        const size = isMobile ? 20 + Math.random() * 40 : 30 + Math.random() * 60;
                        cloud.style.left = left + '%';
                        cloud.style.top = top + '%';
                        cloud.style.fontSize = size + 'px';
                        const delay = Math.random() * 10;
                        cloud.style.animationDelay = delay + 's';
                        extraClouds.appendChild(cloud);
                        extraCloudElements.push(cloud);
                    }
                }
            }

            function setWeather(weather, fromQuiz, flash = false) {
                currentWeather = weather;
                const data = WEATHERS[weather];

                cards.forEach(c => {
                    c.classList.toggle('active', c.dataset.weather === weather);
                    if (!fromQuiz) {
                        c.classList.remove('correct', 'wrong', 'disabled');
                    }
                });

                const isSunny = weather === 'sunny';
                sun.classList.toggle('visible', isSunny);
                sunRays.classList.toggle('visible', isSunny);

                const showClouds = weather !== 'sunny';
                cloud1.classList.toggle('visible', showClouds);
                cloud2.classList.toggle('visible', showClouds);
                cloud3.classList.toggle('visible', showClouds);

                updateExtraClouds(weather);

                const isRainy = weather === 'rainy';
                rainContainer.classList.toggle('visible', isRainy);
                if (isRainy) startRain();
                else stopRain();

                const isSnowy = weather === 'snowy';
                snowContainer.classList.toggle('visible', isSnowy);
                if (isSnowy) startSnow();
                else stopSnow();

                const isWindy = weather === 'windy';
                windContainer.classList.toggle('visible', isWindy);
                if (isWindy) startWind();
                else stopWind();

                if (!fromQuiz) {
                    if (mode === 'explore') speakExplore(weather);
                }
                if (flash) {
                    showFlash(weather);
                }
            }

            function startRain() {
                stopRain();
                const count = getEffectCount(130);
                for (let i = 0; i < count; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'raindrop';
                    const left = Math.random() * 100;
                    const dur = 0.4 + Math.random() * 0.8;
                    const delay = Math.random() * 2;
                    const height = (isMobile ? 8 : 14) + Math.random() * (isMobile ? 12 : 24);
                    drop.style.left = left + '%';
                    drop.style.animationDuration = dur + 's';
                    drop.style.animationDelay = delay + 's';
                    drop.style.height = height + 'px';
                    drop.style.opacity = 0.3 + Math.random() * 0.6;
                    rainContainer.appendChild(drop);
                    rainDrops.push(drop);
                }
            }

            function stopRain() {
                rainDrops.forEach(d => d.remove());
                rainDrops = [];
                rainContainer.innerHTML = '';
            }

            function startSnow() {
                stopSnow();
                const count = getEffectCount(90);
                for (let i = 0; i < count; i++) {
                    const flake = document.createElement('div');
                    flake.className = 'snowflake';
                    flake.textContent = ['❄', '❅', '❆', '✦'][Math.floor(Math.random() * 4)];
                    const left = Math.random() * 100;
                    const dur = 4 + Math.random() * 8;
                    const delay = Math.random() * 5;
                    const size = (isMobile ? 16 : 24) + Math.random() * (isMobile ? 20 : 40);
                    flake.style.left = left + '%';
                    flake.style.animationDuration = dur + 's';
                    flake.style.animationDelay = delay + 's';
                    flake.style.fontSize = size + 'px';
                    flake.style.opacity = 0.5 + Math.random() * 0.5;
                    snowContainer.appendChild(flake);
                    snowFlakes.push(flake);
                }
            }

            function stopSnow() {
                snowFlakes.forEach(f => f.remove());
                snowFlakes = [];
                snowContainer.innerHTML = '';
            }

            function startWind() {
                stopWind();
                const count = getEffectCount(40);
                for (let i = 0; i < count; i++) {
                    const line = document.createElement('div');
                    line.className = 'wind-line';
                    const top = 5 + Math.random() * 80;
                    const dur = 1.5 + Math.random() * 3;
                    const delay = Math.random() * 5;
                    const width = (isMobile ? 60 : 100) + Math.random() * (isMobile ? 120 : 220);
                    const opacity = 0.25 + Math.random() * 0.5;
                    line.style.top = top + '%';
                    line.style.animationDuration = dur + 's';
                    line.style.animationDelay = delay + 's';
                    line.style.width = width + 'px';
                    line.style.opacity = opacity;
                    windContainer.appendChild(line);
                    windLines.push(line);
                }
            }

            function stopWind() {
                windLines.forEach(l => l.remove());
                windLines = [];
                windContainer.innerHTML = '';
            }

            function showFlash(weather) {
                const data = WEATHERS[weather];
                weatherFlash.textContent = data.icon;
                weatherFlash.classList.add('active');
                clearTimeout(flashTimeout);
                flashTimeout = setTimeout(() => {
                    weatherFlash.classList.remove('active');
                }, 1000);
            }

            function speakExplore(weather) {
                const data = WEATHERS[weather];
                bubbleText.innerHTML = `
                    Бүген һава <span class="highlight">${data.tatar}</span> ${data.icon}
                    <span class="eng">Today's weather is <strong>${data.eng}</strong></span>
                `;
            }

            function speakQuizQuestion(target) {
                const data = WEATHERS[target];
                bubbleText.innerHTML = `
                    🧐 <span class="tatar">Кайсы?</span> <span class="highlight">${data.tatar}</span> ?
                    <span class="eng">Where is <strong>${data.eng}</strong>?</span>
                `;
            }

            function speakQuizCorrect(weather) {
                const data = WEATHERS[weather];
                bubbleText.innerHTML = `
                    🎉 <span class="tatar">Әфәрин!</span> ${data.tatar}! ⭐
                    <span class="eng">Well done! <strong>${data.eng}</strong>!</span>
                `;
            }

            function speakQuizWrong(weather) {
                const data = WEATHERS[weather];
                bubbleText.innerHTML = `
                    🤔 <span class="tatar">Тагын кара</span> 
                    <span class="eng">Look again, that's <strong>${data.eng}</strong></span>
                `;
            }

            function speakWelcome() {
                bubbleText.innerHTML = `
                    👋 Сәлам! <span class="tatar">Һава торышы</span> 
                    <span class="eng">Let's learn weather in Tatar!</span>
                `;
            }

            function speakExplorePrompt() {
                bubbleText.innerHTML = `
                    👆 Карточканы бас!
                    <span class="eng">Tap a card to see the weather</span>
                `;
            }

            function speakQuizStart() {
                bubbleText.innerHTML = `
                    🎯 <span class="tatar">Кайсы?</span> 
                    <span class="eng">Find the weather I say!</span>
                `;
            }

            function startQuizRound() {
                if (quizLocked) return;
                const idx = Math.floor(Math.random() * WEATHER_LIST.length);
                quizTarget = WEATHER_LIST[idx];
                cards.forEach(c => {
                    c.classList.remove('correct', 'wrong', 'disabled');
                });
                quizActive = true;
                quizLocked = false;
                setWeather(quizTarget, true, true);
                setTimeout(() => {
                    speakQuizQuestion(quizTarget);
                }, 1000);
            }

            function handleQuizClick(card) {
                if (quizLocked) return;
                if (!quizActive) return;
                const weather = card.dataset.weather;
                if (weather === quizTarget) {
                    quizLocked = true;
                    card.classList.add('correct');
                    score++;
                    scoreDisplay.textContent = score;
                    speakQuizCorrect(weather);
                    fireConfetti();
                    showFlash(weather);
                    setTimeout(() => {
                        card.classList.remove('correct');
                        quizLocked = false;
                        if (mode === 'quiz') startQuizRound();
                        else quizActive = false;
                    }, 1800);
                } else {
                    card.classList.add('wrong');
                    speakQuizWrong(weather);
                    showFlash(weather);
                    setTimeout(() => {
                        card.classList.remove('wrong');
                    }, 800);
                }
            }

            function fireConfetti() {
                const colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF6BD6', '#FF9F43', '#A29BFE'];
                const container = confettiContainer;
                const count = isMobile ? 40 : 80;
                for (let i = 0; i < count; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    const size = (isMobile ? 6 : 10) + Math.random() * (isMobile ? 12 : 22);
                    const left = Math.random() * 100;
                    const dur = 1.8 + Math.random() * 2.2;
                    const delay = Math.random() * 0.8;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const rotate = Math.random() * 360;
                    piece.style.left = left + '%';
                    piece.style.width = size + 'px';
                    piece.style.height = size * (0.4 + Math.random() * 0.8) + 'px';
                    piece.style.background = color;
                    piece.style.animationDuration = dur + 's';
                    piece.style.animationDelay = delay + 's';
                    piece.style.transform = 'rotate(' + rotate + 'deg)';
                    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    container.appendChild(piece);
                    setTimeout(() => piece.remove(), (dur + delay) * 1000 + 300);
                }
            }

            function onCardClick(e) {
                const card = e.currentTarget;
                if (card.classList.contains('disabled')) return;
                const weather = card.dataset.weather;

                if (mode === 'explore') {
                    setWeather(weather, false);
                } else if (mode === 'quiz') {
                    if (!quizActive) {
                        quizActive = true;
                        quizTarget = weather;
                        startQuizRound();
                        return;
                    }
                    handleQuizClick(card);
                }
            }

            function setMode(newMode) {
                mode = newMode;
                modeExplore.classList.toggle('active', mode === 'explore');
                modeQuiz.classList.toggle('active', mode === 'quiz');
                cards.forEach(c => {
                    c.classList.remove('correct', 'wrong', 'disabled');
                });

                if (mode === 'explore') {
                    quizActive = false;
                    quizLocked = false;
                    setWeather(currentWeather, false);
                    speakExplorePrompt();
                } else {
                    quizActive = false;
                    quizLocked = false;
                    speakQuizStart();
                    setTimeout(() => {
                        if (mode === 'quiz') startQuizRound();
                    }, 700);
                }
            }

            function onKeyDown(e) {
                if (e.key === 'e' || e.key === 'E') { setMode('explore');
                    e.preventDefault(); }
                if (e.key === 'q' || e.key === 'Q') { setMode('quiz');
                    e.preventDefault(); }
                if (e.key >= '1' && e.key <= '5') {
                    const idx = parseInt(e.key) - 1;
                    if (idx < cards.length) cards[idx].click();
                }
            }

            function init() {
                isMobile = window.innerWidth < 600;
                setWeather('sunny', false);
                speakWelcome();
                cards.forEach(c => c.addEventListener('click', onCardClick));
                modeExplore.addEventListener('click', () => setMode('explore'));
                modeQuiz.addEventListener('click', () => setMode('quiz'));
                document.addEventListener('keydown', onKeyDown);
                setMode('explore');

                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        isMobile = window.innerWidth < 600;
                        const w = currentWeather;
                        if (w === 'rainy') { stopRain();
                            startRain(); }
                        if (w === 'snowy') { stopSnow();
                            startSnow(); }
                        if (w === 'windy') { stopWind();
                            startWind(); }
                        // extra clouds redraw
                        if (w === 'cloudy') updateExtraClouds('cloudy');
                    }, 300);
                });
                cards.forEach((c, i) => {
                    c.setAttribute('aria-label', `Card ${i+1}: ${c.dataset.tatar} (${c.dataset.eng})`);
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
